name: Build Kaestral v1.0.5 Windows installer

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-kaestral-v1.0.5.yml"

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out official Kaestral v1.0.5 source
        uses: actions/checkout@v4
        with:
          repository: prabindersinghh/Kaestral-pro
          ref: v1.0.5
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Rust MSVC toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install FFmpeg binaries
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey failed to install FFmpeg' }
          # Bundle *real* ffmpeg.exe / ffprobe.exe, not Chocolatey shims.
          $choco = if ($env:ChocolateyInstall) { $env:ChocolateyInstall } else { 'C:\ProgramData\chocolatey' }
          $pkgPath = Join-Path $choco 'lib\ffmpeg'
          $ffmpeg = Get-ChildItem -LiteralPath $pkgPath -Recurse -File -Filter 'ffmpeg.exe' -ErrorAction Stop | Select-Object -First 1
          $ffprobe = Get-ChildItem -LiteralPath $pkgPath -Recurse -File -Filter 'ffprobe.exe' -ErrorAction Stop | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw 'Real FFmpeg or FFprobe executable not found' }
          "FFMPEG_SRC=$($ffmpeg.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FFPROBE_SRC=$($ffprobe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "FFmpeg: $($ffmpeg.FullName)"
          Write-Host "FFprobe: $($ffprobe.FullName)"

      - name: Prepare unsigned personal build
        shell: pwsh
        run: |
          # The original publisher's Tauri updater signing key isn't public.
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));if(c.version!=='1.0.5')process.exit(1);c.bundle.createUpdaterArtifacts=false;fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n')"
          if ($LASTEXITCODE -ne 0) { throw 'Could not configure unsigned build' }

      - name: Install Kaestral dependencies
        shell: pwsh
        run: npm ci --no-audit --no-fund

      - name: Install Remotion dependencies
        shell: pwsh
        working-directory: remotion
        run: npm ci --no-audit --no-fund

      - name: Compile Windows desktop app and installer
        shell: pwsh
        run: npm run tauri build

      - name: Confirm installer and write SHA-256 checksum
        shell: pwsh
        run: |
          $out = 'src-tauri/target/release/bundle/nsis'
          $exe = Get-ChildItem -LiteralPath $out -File -Filter 'Kaestral_1.0.5_x64-setup.exe' | Select-Object -First 1
          if (-not $exe) { throw "Installer wasn't produced in $out" }
          $hash = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($exe.Name)" | Set-Content -LiteralPath (Join-Path $out 'SHA256SUMS.txt') -Encoding ASCII
          Write-Host "Installer: $($exe.FullName) ($([math]::Round($exe.Length / 1MB)) MB)"
          Write-Host "SHA256: $hash"

      - name: Upload installer for download
        uses: actions/upload-artifact@v4
        with:
          name: Kaestral-1.0.5-Windows-installer-unsigned
          path: |
            src-tauri/target/release/bundle/nsis/Kaestral_1.0.5_x64-setup.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
